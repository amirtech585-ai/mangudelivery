server:
  port: 8080
  error:
    include-message: always

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mangudelivery}
    username: ${DB_USER:mangu}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}   # use "validate" with Flyway/Liquibase in production
    properties:
      hibernate.jdbc.time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:720}
  admin:
    email: ${ADMIN_EMAIL:admin@mangu.local}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  pricing:
    delivery-fee-ugx: ${DELIVERY_FEE_UGX:3000}
    service-fee-ugx: ${SERVICE_FEE_UGX:1000}
    commission-percent: ${COMMISSION_PERCENT:5}
